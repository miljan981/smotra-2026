<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>SMOTRA 2026 — pregled za telefon</title>
<style>
  body{margin:0;background:#23282a;display:flex;flex-direction:column;align-items:center;
    font-family:system-ui,sans-serif;min-height:100vh;padding:24px 10px}
  h1{color:#e7c34a;font-size:1rem;font-weight:500;letter-spacing:.08em;margin:0 0 16px}
  .phone{width:390px;height:780px;border:10px solid #111;border-radius:34px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5);background:#fff;position:relative}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:20px;
    background:#111;border-radius:0 0 14px 14px;z-index:5}
  iframe{width:100%;height:100%;border:none}
  p{color:#8a9599;font-size:.8rem;max-width:420px;text-align:center}
</style>
</head>
<body>
<h1>📱 SMOTRA 2026 — mobilni pregled (390 × 780)</h1>
<div class="phone"><div class="notch"></div><iframe src="/"></iframe></div>
<p>Ovo je isti sajt, samo prikazan u širini telefona. Sve radi: meni, pop-up, admin.</p>
</body>
</html>
